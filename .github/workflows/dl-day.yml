name: dl-day
# Twice a day (started by the RailPulse scheduler, workflow_dispatch): the delays of every train of yesterday, from the RailPulse delay log joined with
# the day's timetable (dl_day.js → railpulse.ch/api/live/tt/dlday for railpulse.ch/stats), then the per-train history (trn_build.js → railpulse.ch/train).
# At night a provisional pass (trains still running get their last forecast); at noon the final pass (final = 1) redoes the day with the night trains arrived.
# Copy of tools/dl-day.yml in the RailPulse repository: keep them identical.
on:
  workflow_dispatch:
    inputs:
      day: { description: 'day AAAAMMGG (default: yesterday)', required: false, default: '' }
      final: { description: '1 = final pass (redo the provisional day); redo = also redo a final day (after fixing data by hand)', required: false, default: '' }
concurrency:
  group: dl-day
  cancel-in-progress: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Great Britain: real times at every stop from the hourly Darwin snapshots of the whole day (uk_at.py → exact-uk.json, read by the two steps below);
      # if it fails the delay log alone is used, as before
      - run: pip install -q requests && python uk_at.py ${{ inputs.day }} --out exact-uk.json
        continue-on-error: true
        timeout-minutes: 15
        env:
          RDM_KEY_SNAP: ${{ secrets.RDM_KEY_SNAP }}
      - run: node dl_day.js ${{ inputs.day }} --upload ${{ inputs.final != '' && '--final' || '' }}
        env:
          SOCIAL_CRON_KEY: ${{ secrets.SOCIAL_CRON_KEY }}
      # history of every train (delay at every stop, 180 days) for railpulse.ch/train, in D1 via /api/live/trn/...
      - run: node trn_build.js ${{ inputs.day }} --upload ${{ inputs.final == '1' && '--final' || '' }} ${{ inputs.final == 'redo' && '--redo' || '' }}
        if: always()
        env:
          SOCIAL_CRON_KEY: ${{ secrets.SOCIAL_CRON_KEY }}
