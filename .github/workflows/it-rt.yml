name: it-rt
# Delays of Italian trains: SIRI-ET feed of Trenitalia (proxy.busone.app, listed as a source by the open Transitous project) -> railpulse.ch/api/live/tt/it-rt
# Started by the RailPulse scheduler (workflow_dispatch) only while someone is watching the Italian map (or by day).
on:
  workflow_dispatch:
concurrency:
  group: it-rt
  cancel-in-progress: false
jobs:
  rt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests && python it_rt.py
        env:
          SOCIAL_CRON_KEY: ${{ secrets.SOCIAL_CRON_KEY }}
